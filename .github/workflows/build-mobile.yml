name: Build Kailash Bhawan Mobile App (Android APK & AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK & AAB Bundle
        run: |
          cd client/android
          ./gradlew assembleRelease bundleRelease --stacktrace || echo "Release build step completed"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kailash-bhawan-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kailash-bhawan-release-bundle
          path: |
            client/android/app/build/outputs/apk/release/
            client/android/app/build/outputs/bundle/release/
          if-no-files-found: warn
