name: Build Kailash Bhawan Mobile App (Android APK & AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Copy Web Assets to Android Project
        run: |
          mkdir -p client/android/app/src/main/assets/public
          cp -r client/dist/* client/android/app/src/main/assets/public/
          cd client
          export CAPACITOR_TELEMETRY=0
          npx @capacitor/cli copy android || echo "Capacitor copy finished"

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk ./kailash-bhawan.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kailash-bhawan-apk
          path: ./kailash-bhawan.apk
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "KAILASH BHAWAN Mobile App v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 KAILASH BHAWAN Native Android Mobile App
            Official Android APK build for KAILASH BHAWAN.

            ### 📥 Download Link:
            - **Direct Download**: [kailash-bhawan.apk](https://github.com/rohittt790-create/ghar/releases/download/v1.0.0/kailash-bhawan.apk)

            ### 📲 How to Install on Android:
            1. Tap the direct download link on your phone.
            2. When the download finishes, tap the notification or open your **Downloads** folder.
            3. Tap **Install** (if prompted, enable *“Allow installation from this source”*).
            4. Open KAILASH BHAWAN and enjoy!
          files: |
            kailash-bhawan.apk
            client/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
