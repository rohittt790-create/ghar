<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- House Structure Icon -->
  <g transform="translate(64, 56)" filter="url(#glow)">
    <!-- Roof Peak -->
    <path d="M192 40 L340 160 L310 160 L310 210 L340 210 L192 90 L44 210 L74 210 L74 160 L44 160 Z" fill="url(#goldGrad)" opacity="0.3" />
    <path d="M192 50 L348 176 L316 176 L316 330 L68 330 L68 176 L36 176 Z" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Floors & Structure Lines -->
    <!-- Chimney -->
    <path d="M260 100 L260 70 L295 70 L295 130" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />

    <!-- Floor Dividers -->
    <line x1="68" y1="230" x2="316" y2="230" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-dasharray="8 8" />

    <!-- Windows (Top Floor) -->
    <rect x="108" y="160" width="56" height="50" rx="8" fill="#38bdf8" fill-opacity="0.8" />
    <rect x="220" y="160" width="56" height="50" rx="8" fill="#38bdf8" fill-opacity="0.8" />

    <!-- Main Door & Ground Floor -->
    <path d="M164 330 L164 250 A28 28 0 0 1 220 250 L220 330 Z" fill="url(#goldGrad)" />
    <!-- Door Knob -->
    <circle cx="208" cy="292" r="5" fill="#0f172a" />

    <!-- Balcony Railing -->
    <line x1="90" y1="280" x2="135" y2="280" stroke="#f59e0b" stroke-width="6" />
    <line x1="95" y1="280" x2="95" y2="330" stroke="#f59e0b" stroke-width="4" />
    <line x1="112" y1="280" x2="112" y2="330" stroke="#f59e0b" stroke-width="4" />
    <line x1="130" y1="280" x2="130" y2="330" stroke="#f59e0b" stroke-width="4" />

    <!-- Right Window -->
    <rect x="245" y="270" width="48" height="42" rx="6" fill="#38bdf8" fill-opacity="0.8" />
  </g>

  <!-- Typography: KB Monogram & Kailash Bhawan -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff" text-anchor="middle">KAILASH BHAWAN</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="#f59e0b" text-anchor="middle">SMART RESIDENCE</text>
</svg>