[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  included_files = ["server/dist/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
